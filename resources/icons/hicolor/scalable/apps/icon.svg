<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>COSMIC Writing Tools</title>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dde3ee"/>
      <stop offset="1" stop-color="#9eacc4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4272"/>
      <stop offset="1" stop-color="#16233f"/>
    </linearGradient>
  </defs>

  <!-- Bezel + screen -->
  <rect x="12" y="22" width="104" height="82" rx="11" fill="url(#bezel)"/>
  <rect x="19" y="29" width="90" height="68" rx="5.5" fill="url(#screen)"/>

  <!-- Text lines -->
  <g stroke-linecap="round">
    <rect x="29" y="40" width="38" height="5" rx="2.5" fill="#8fa6d1"/>
    <!-- highlighted (rewritten) line -->
    <rect x="26" y="52" width="76" height="12" rx="3.5" fill="#26b3ad" opacity=".35"/>
    <rect x="29" y="55.5" width="64" height="5" rx="2.5" fill="#c9f3ee"/>
    <rect x="29" y="69" width="56" height="5" rx="2.5" fill="#8fa6d1"/>
    <rect x="29" y="81" width="30" height="5" rx="2.5" fill="#8fa6d1"/>
    <!-- caret -->
    <rect x="64" y="78.5" width="2.5" height="10" rx="1.2" fill="#26b3ad"/>
  </g>

  <!-- Sparkle accent (same orange as the Terminal prompt) -->
  <path d="M90 33 Q91.5 42 100 44 Q91.5 46 90 55 Q88.5 46 80 44 Q88.5 42 90 33 Z" fill="#f5a623" transform="translate(4 1) scale(.9)"/>
</svg>
